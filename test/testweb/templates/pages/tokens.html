{{define "content"}}{{if .NewToken}}<code id="new-token">{{.NewToken}}</code>{{end}}<form method="post" action="{{url "tokens.create"}}"><input name="name"><input type="checkbox" name="scopes" value="inbox:write" checked><input type="checkbox" name="scopes" value="recipes:read" checked><select name="expires_in_days"><option value="0">0</option></select><button data-test="token-new">new</button></form>{{range .Tokens}}<div data-test="token" data-status="{{.Status}}">{{.Name}} {{.Prefix}}{{if eq .Status "active"}}<form method="post" action="{{url "tokens.revoke" .ID}}"><button>revoke</button></form>{{end}}</div>{{end}}{{range $k, $v := .FormErrors}}<p class="err" data-field="{{$k}}">{{$v}}</p>{{end}}{{end}}
